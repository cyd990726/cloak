# Change this to a globally unique Fly app name before first deploy.
app = "recognition-cloak"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  CLOAK_HOST = "0.0.0.0"
  CLOAK_PORT = "8080"
  CLOAK_COUNTRY_DB = "data/BIT4BF5.tmp"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
